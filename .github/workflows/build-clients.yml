name: Build Pulse VPN Clients (Windows .exe & Android .apk)

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-core:
    name: Pre-Build Unit Test & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Core Engine Test Suite
        run: python3 test/test_core_engine.py

  build-windows-installer:
    name: Build Windows Standalone .exe Installer (Wintun + Inno Setup)
    needs: verify-core
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch Signed Wintun Driver (wintun.dll amd64)
        shell: pwsh
        run: |
          $wintunUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          Invoke-WebRequest -Uri $wintunUrl -OutFile "$env:TEMP\wintun.zip"
          Expand-Archive -Path "$env:TEMP\wintun.zip" -DestinationPath "$env:TEMP\wintun_extracted" -Force
          Copy-Item "$env:TEMP\wintun_extracted\wintun\bin\amd64\wintun.dll" -Destination "windows\wintun.dll" -Force
          if (-not (Test-Path "windows\wintun.dll")) {
            throw "Failed to bundle wintun.dll"
          }

      - name: Install and Configure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Scaffold Flutter Windows Platform
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --org com.shivansh
          flutter pub get

      - name: Build Flutter Windows Release Binary
        shell: pwsh
        run: |
          flutter build windows --release

      - name: Verify and Stage Windows Release Binaries
        shell: pwsh
        run: |
          if ((Test-Path "build\windows\runner\Release") -and -not (Test-Path "build\windows\x64\runner\Release")) {
            New-Item -ItemType Directory -Force -Path "build\windows\x64\runner\Release"
            Copy-Item -Recurse "build\windows\runner\Release\*" "build\windows\x64\runner\Release\" -Force
          }
          New-Item -ItemType Directory -Force -Path "dist"

      - name: Compile PulseVPN-Setup.exe with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\installer.iss"
          if (-not (Test-Path "dist\PulseVPN-Setup.exe")) {
            throw "PulseVPN-Setup.exe was not generated by Inno Setup"
          }

      - name: Upload Windows Standalone Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseVPN-Windows-Installer
          path: dist/PulseVPN-Setup.exe

  build-android-apk:
    name: Build Android Signed Release .apk
    needs: verify-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Flutter Android Platform
        run: |
          flutter create . --platforms=android --org com.shivansh
          flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release

      - name: Sign Android APK with Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          UNSIGNED_APK=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find build -name "*release*.apk" 2>/dev/null | head -n 1)
          fi
          SIGNED_APK="dist/PulseVPN-Android-arm64-signed.apk"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          else
            keytool -genkeypair -v \
              -keystore /tmp/release.keystore \
              -alias pulsevpn \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass pulsevpn123 -keypass pulsevpn123 \
              -dname "CN=Pulse VPN, OU=Security, O=Shivansh Dimri, L=Mumbai, S=MH, C=IN"
            ANDROID_KEYSTORE_PASSWORD="pulsevpn123"
            ANDROID_KEY_ALIAS="pulsevpn"
            ANDROID_KEY_PASSWORD="pulsevpn123"
          fi
          APKSIGNER="$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "${ANDROID_KEY_ALIAS:-pulsevpn}" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD:-pulsevpn123}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD:-pulsevpn123}" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose "$SIGNED_APK"
          rm -f /tmp/release.keystore

      - name: Upload Signed Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseVPN-Android-Signed-APK
          path: dist/PulseVPN-Android-arm64-signed.apk

  publish-release:
    name: Publish Release Binaries to GitHub Releases
    needs:
      - build-windows-installer
      - build-android-apk
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Client Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach PulseVPN-Setup.exe & Signed APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/PulseVPN-Setup.exe
            release-assets/PulseVPN-Android-arm64-signed.apk
          generate_release_notes: true
