services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: pulse-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SERVERURL=${WG_HOST:-auto}
      - SERVERPORT=51820
      - PEERS=${WG_PEERS:-3}
      - PEERDNS=1.1.1.1,1.0.0.1
      - INTERNAL_SUBNET=10.66.66.0
      - ALLOWEDIPS=0.0.0.0/0,::/0
      - LOG_CONFS=true
    volumes:
      - ./wgdata/config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: pulse-wg-easy
    profiles:
      - ui
    environment:
      - WG_HOST=${WG_HOST:-127.0.0.1}
      - PASSWORD_HASH=${WG_ADMIN_PASSWORD_HASH:-}
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.66.67.x
      - WG_DEFAULT_DNS=1.1.1.1,1.0.0.1
      - WG_MTU=1420
      - WG_ALLOWED_IPS=0.0.0.0/0,::/0
      - WG_PERSISTENT_KEEPALIVE=25
    volumes:
      - ./wgdata/wg-easy:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
